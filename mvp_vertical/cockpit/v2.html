<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151618">
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/v2.css">
  <link rel="stylesheet" href="styles/schema_editor.css">
  <link rel="stylesheet" href="styles/contacts_editor.css">
  <link rel="stylesheet" href="styles/information_create.css">
  <link rel="stylesheet" href="styles/project_claim_view.css">
  <link rel="stylesheet" href="styles/v2_refinement.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.6/swiper-bundle.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/v2_swiper.css">
  <link rel="stylesheet" href="styles/v2_shell_controls.css">
  <title>Pantheon Cockpit</title>
</head>
<body class="v2-body">
  <header class="app-header v2-header">
    <a class="brand" href="./v2.html" aria-label="Pantheon Cockpit">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span><strong>COCKPIT</strong></span>
    </a>
    <div class="v2-header-actions">
      <button id="v2-hermes-toggle" class="v2-hermes-toggle" type="button" aria-controls="v2-hermes-dock" aria-expanded="false">Hermès</button>
      <output id="v2-network" class="network-pill" aria-live="polite">hors ligne</output>
    </div>
  </header>

  <main class="v2-shell">
    <section class="v2-loader" aria-label="Connexion Agency Data">
      <label>
        <span>Affaire</span>
        <input id="v2-project" autocomplete="off" placeholder="LIEUREY ou project-lieurey">
      </label>
      <label>
        <span>Clé d’accès</span>
        <input id="v2-token" type="password" autocomplete="off" placeholder="lecture / édition">
      </label>
      <button id="v2-load" class="primary-action" type="button">Charger</button>
    </section>

    <nav class="v2-space-rail" aria-label="Espaces principaux">
      <button type="button" data-space="pantheon">Pantheon</button>
      <button type="button" data-space="decisions">Décisions</button>
      <button type="button" data-space="affaires">Affaires</button>
      <button type="button" data-space="connaissances">Connaissances</button>
      <button type="button" data-space="outils">Outils</button>
    </nav>

    <section class="v2-location" aria-live="polite">
      <p id="v2-breadcrumb" class="v2-breadcrumb">Pantheon</p>
      <p id="v2-status" class="v2-status v2-status--quiet">Recto : ← → frères · ↑ enfants · ↓ parent.</p>
    </section>

    <section class="v2-navigation" aria-label="Navigation de la carte courante">
      <button id="v2-previous" class="v2-nav-button" type="button" aria-label="Carte précédente">←</button>
      <button id="v2-ascend" class="v2-nav-button v2-nav-button--vertical" type="button" aria-label="Remonter au parent">↓</button>
      <button id="v2-flip" class="v2-nav-button" type="button" aria-label="Retourner la carte">recto / verso</button>
      <button id="v2-descend" class="v2-nav-button v2-nav-button--vertical" type="button" aria-label="Descendre dans les enfants">↑</button>
      <button id="v2-next" class="v2-nav-button" type="button" aria-label="Carte suivante">→</button>
    </section>

    <section id="v2-stage" class="v2-stage" aria-label="Carte courante"></section>
  </main>

  <aside id="v2-hermes-dock" class="v2-hermes-dock" aria-label="Hermès" hidden>
    <div class="v2-handoff-shell">
      <div class="v2-handoff-head">
        <div class="v2-hermes-mark" aria-hidden="true">H</div>
        <span id="v2-handoff-scope" class="v2-handoff-scope">Aucune carte courante</span>
        <button id="v2-hermes-close" class="v2-hermes-close" type="button" aria-label="Fermer Hermès">×</button>
      </div>

      <section class="v2-context-panel v2-context-panel--hermes" aria-label="Contexte">
        <input id="v2-context-input" class="v2-context-input" autocomplete="off" placeholder="_Affaire · @Personne · *recherche" aria-label="Rechercher un contexte">
        <div id="v2-context-selected" class="v2-context-selected" aria-label="Contexte sélectionné"></div>
        <p id="v2-context-message" class="v2-context-message" aria-live="polite">Utilisez _Affaire, @Personne ou *recherche globale.</p>
        <div id="v2-context-results" class="v2-context-results" aria-label="Résultats de contexte"></div>
      </section>

      <textarea id="v2-handoff-question" class="v2-handoff-question" rows="2" placeholder="Poser une question…" aria-label="Question pour Hermès"></textarea>
      <label class="v2-handoff-option">
        <input id="v2-handoff-descendants" type="checkbox" checked>
        <span>Inclure les descendants</span>
      </label>
      <div class="v2-handoff-policy-grid">
        <label class="v2-handoff-actor-field">
          <span>Acteur</span>
          <input id="v2-handoff-actor" autocomplete="name" placeholder="IFan">
        </label>
        <label class="v2-handoff-actor-field">
          <span>Validité</span>
          <select id="v2-handoff-ttl" aria-label="Durée de validité de l’admission">
            <option value="">Choisir…</option>
            <option value="300">5 min</option>
            <option value="900">15 min</option>
            <option value="1800">30 min</option>
            <option value="3600">60 min</option>
          </select>
        </label>
      </div>
      <label class="v2-handoff-actor-field">
        <span>Révocation</span>
        <input id="v2-handoff-revoke-reason" autocomplete="off" placeholder="Motif">
      </label>
      <div class="v2-handoff-actions v2-handoff-actions--four">
        <button id="v2-handoff-prepare" type="button">Préparer</button>
        <button id="v2-handoff-submit" type="button" disabled>Créer</button>
        <button id="v2-handoff-admit" type="button" disabled>Admettre</button>
        <button id="v2-handoff-revoke" type="button" disabled>Révoquer</button>
      </div>
      <p id="v2-handoff-message" class="v2-handoff-message" aria-live="polite"></p>
      <div id="v2-handoff-preview" class="v2-handoff-preview" aria-label="Aperçu"></div>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.6/swiper-bundle.min.js" crossorigin="anonymous"></script>
  <script src="v2_swiper.js"></script>
  <script src="v2_shell_controls.js"></script>
  <script src="structured_interface.js" defer></script>
  <script src="context_resolver.js" defer></script>
  <script src="agency_data_binding.js" defer></script>
  <script src="spatial_navigation.js" defer></script>
  <script src="v2_app_schema.js" defer></script>
  <script src="v2_interaction_policy.js" defer></script>
  <script src="project_claim_view_adapter.js" defer></script>
  <script src="information_view_adapter.js" defer></script>
  <script src="v2_context.js" defer></script>
  <script src="v2_handoff.js" defer></script>
  <script src="v2_actions.js" defer></script>
  <script src="v2_candidate_actions.js" defer></script>
  <script src="schema_editor.js" defer></script>
  <script src="contacts_editor.js" defer></script>
  <script src="information_create.js" defer></script>
</body>
</html>
