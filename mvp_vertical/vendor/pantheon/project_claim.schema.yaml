$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Project Claim
description: >-
  Governance schema for a typed, status-qualified assertion projected on a Project.
  A ProjectClaim is a semantic linking seam and a governed project assertion, not a
  visible Cockpit card family, an Execution Result, Evidence, a Decision or an
  approved/opposable truth. Source-backed states reference a governed semantic
  entity through backing_ref. A Claim created from an execution candidate retains
  the exact candidate identity in provenance; the candidate itself is never
  promoted or mutated into a Claim.
type: object
required: [claim_id, project_id, claim_type, value, provenance, status, certainty, observed_at]
properties:
  claim_id: {type: string, pattern: "^[a-z0-9._-]+$"}
  project_id: {type: string, minLength: 1}
  claim_type: {type: string, minLength: 1}
  value: {type: [string, number, boolean, "null"]}
  unit: {type: [string, "null"]}
  backing_ref:
    type: [object, "null"]
    required: [entity_type, entity_id]
    properties:
      entity_type: {type: string, minLength: 1}
      entity_id: {type: string, minLength: 1}
      observed_status: {type: [string, "null"]}
    additionalProperties: false
  provenance:
    type: object
    required: [source_kind]
    properties:
      source_kind:
        enum: [information, document, human_assertion, derived, execution_result, external_projection]
      source_ref: {type: [string, "null"]}
      candidate_ref:
        type: [object, "null"]
        required: [execution_id, result_id]
        properties:
          execution_id: {type: string, pattern: "^[a-z0-9][a-z0-9._-]*$"}
          result_id: {type: string, pattern: "^[a-z0-9][a-z0-9._-]*$"}
          review_disposition_id: {type: [string, "null"], pattern: "^[a-z0-9][a-z0-9._-]*$"}
        additionalProperties: false
      asserted_by: {type: [string, "null"]}
      derivation_note: {type: [string, "null"]}
    additionalProperties: false
  status:
    enum: [asserted, source_backed, verified, contested, retired]
  certainty:
    enum: [E0, E1, E2, E3, E4]
  observed_at: {type: string, format: date-time}
  effective_at: {type: [string, "null"], format: date-time}
  revision: {type: integer, minimum: 0, default: 0}
  supersedes: {type: [string, "null"]}
  note: {type: [string, "null"]}
  governance_refs:
    type: array
    items: {type: string}
additionalProperties: false
allOf:
  - if:
      properties: {status: {enum: [source_backed, verified]}}
      required: [status]
    then:
      required: [backing_ref]
      properties: {backing_ref: {type: object}}
  - if:
      properties:
        provenance:
          properties: {source_kind: {const: execution_result}}
          required: [source_kind]
      required: [provenance]
    then:
      properties:
        provenance:
          required: [candidate_ref]
          properties: {candidate_ref: {type: object}}
  - if:
      properties:
        provenance:
          properties: {source_kind: {const: derived}}
          required: [source_kind]
      required: [provenance]
    then:
      properties:
        provenance:
          required: [derivation_note]
x-boundary:
  runtime_execution: false
  evidence_admission: false
  automatic_canonization: false
  execution_result_promotion: false
