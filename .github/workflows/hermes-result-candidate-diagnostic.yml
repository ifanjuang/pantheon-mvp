name: Hermes Result Candidate Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mvp
          POSTGRES_PASSWORD: mvp
          POSTGRES_DB: mvp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mvp -d mvp"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Capture Hermes result candidate tests
        shell: bash
        env:
          MVP_PG_DSN: postgresql://mvp:mvp@localhost:5433/mvp
        run: |
          set +e
          pytest -q --tb=long tests/test_hermes_runtime_return.py tests/test_hermes_runtime_return_api.py > /tmp/hermes-result.log 2>&1
          status=$?
          cat /tmp/hermes-result.log
          echo "$status" > /tmp/hermes-result-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-result-candidate-diagnostic
          path: |
            /tmp/hermes-result.log
            /tmp/hermes-result-status.txt
          if-no-files-found: error
          retention-days: 1
