          write(path, text)

          # Regression tests for the previously uncovered failure windows.
          path = 'tests/test_knowledge_edit_variants.py'
          text = read(path)
          text = replace_once(
              text,
              '    authority: dict | None = None,\n) -> tuple[str, str]:\n',
