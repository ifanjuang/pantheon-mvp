name: Hindsight Hermes O1 Sandbox

on:
  pull_request:
    paths:
      - ".github/workflows/hindsight-hermes-o1-lab.yml"
      - "tools/run_hindsight_hermes_o1.py"
      - "tools/run_hindsight_hermes_o1.sh"
      - "tools/hindsight_hermes_o1_fixture.py"
      - "tests/test_hindsight_hermes_o1_contract.py"
  workflow_dispatch:
    inputs:
      hindsight_api_url:
        description: "Sandbox Hindsight API URL"
        required: true
        type: string
      bank_id:
        description: "Synthetic Hindsight bank"
        required: false
        default: "pantheon-o1-synthetic"
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q tests/test_hindsight_hermes_o1_contract.py

  live-lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HERMES_RELEASE_COMMIT: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
      HINDSIGHT_API_URL: ${{ inputs.hindsight_api_url }}
      HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_LAB_API_KEY }}
      HINDSIGHT_BANK_ID: ${{ inputs.bank_id }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: pantheon-mvp
      - name: Checkout exact Hermes 0.20.0 source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_RELEASE_COMMIT }}
          path: hermes-upstream
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute O1 live sandbox
        working-directory: pantheon-mvp
        run: bash tools/run_hindsight_hermes_o1.sh
      - name: Upload bounded observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-hermes-o1-${{ github.run_id }}
          path: ${{ runner.temp }}/hindsight-hermes-o1/artifacts/
          if-no-files-found: warn
          retention-days: 14
