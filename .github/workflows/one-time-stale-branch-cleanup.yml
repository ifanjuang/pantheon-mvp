name: One-time reviewed stale branch cleanup

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/one-time-stale-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/repository-branch-cleanup-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete reviewed stale branches and cleanup branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            "agent/cockpit-five-spaces-card-contract"
            "agent/cockpit-five-spaces-rebase-base"
            "agent/cockpit-five-spaces-rebase-base-2"
            "agent/cockpit-five-spaces-reconciled"
            "agent/cockpit-integration-main63"
            "agent/cockpit-merge-base"
            "agent/cockpit-merge-base-final"
            "agent/cockpit-rebase-main63"
            "agent/cockpit-rebase-target"
            "agent/cockpit-rebase-target-final"
            "agent/cockpit-reconcile-main63"
            "agent/cockpit-static-demo"
            "agent/hermes-run-launch-junction"
            "agent/hermes-v019-runs-observer"
            "agent/native-radix-cockpit-renderer"
            "agent/native-radix-cockpit-renderer-review"
            "agent/optional-paperless-capability"
            "agent/runtime-profile-observations"
            "agent/schema-driven-child-collections"
            "agent/schema-driven-child-collections-final"
            "agent/schema-driven-child-collections-final2"
            "agent/schema-driven-child-collections-impl"
            "agent/schema-driven-child-collections-v2"
            "agent/schema-driven-child-collections-work"
            "agent/spatial-new-information"
            "agent/vendor-radix-icons-trigger"
            "claude/analyze-dependent-repos-optimization-x1udnu"
            "claude/pantheon-repos-audit-s46afb"
            "feat/document-inbox-slice"
            "feature/cockpit-v3-real-collections"
            "feature/demo-ifja-universe"
            "fix/document-chunk-inspector-guards"
            "refactor/cockpit-neutral-entrypoints"
            "refactor/cross-repo-architecture-audit"
            "refactor/remove-root-card-literals"
            "refactor/stable-agency-routes"
            "tool-card-cockpit"
            "chore/repository-branch-cleanup-mvp"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "Refusing protected branch: $branch" >&2
              exit 1
            fi

            encoded_branch="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            else
              echo "Already absent: $branch"
            fi
          done
