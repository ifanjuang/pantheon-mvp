name: Run A-B relation convergence on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/converge-a-b-entity-relations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute reviewed bounded patch
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-a-b-relations-convergence.yml')
              .read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['patch']['steps']
          apply_step = next(
              step for step in steps
              if step.get('name') == 'Apply bounded convergence patch'
          )
          Path('/tmp/apply-convergence.sh').write_text(
              apply_step['run'], encoding='utf-8'
          )
          PY
          bash /tmp/apply-convergence.sh
          rm -f .github/workflows/run-a-b-relations-convergence-on-pr.yml
          rm -f .github/a-b-relations-patch.trigger

      - name: Validate and publish patch result
        shell: bash
        run: |
          python -m compileall -q mvp_vertical tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(relations): converge Source Information and EntityRef edges"
          git push origin HEAD:${{ github.head_ref }}
