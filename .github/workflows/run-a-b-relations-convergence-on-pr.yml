name: Run A-B relation convergence on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/converge-a-b-entity-relations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute reviewed bounded patch
        shell: bash
        run: |
          awk '
            /^      - name: Apply bounded convergence patch$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Compile patched Python$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-a-b-relations-convergence.yml \
            > /tmp/apply-convergence.sh
          test -s /tmp/apply-convergence.sh
          bash /tmp/apply-convergence.sh
          rm -f .github/workflows/run-a-b-relations-convergence-on-pr.yml
          rm -f .github/a-b-relations-patch.trigger

      - name: Validate and publish patch result
        shell: bash
        run: |
          python -m compileall -q mvp_vertical tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(relations): converge Source Information and EntityRef edges"
          git push origin HEAD:${{ github.head_ref }}
