name: Cleanup Work review projection

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/decision-requests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove obsolete Work Decision projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mvp_vertical/cockpit/projection/cockpit_projection.js")
          text = path.read_text(encoding="utf-8")
          start_marker = "  function normalizeWorkDecision(projection) {\n"
          end_marker = "\n  function candidateFieldTitle(key) {\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("bounded Work review markers are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          old_context = "normalizeProject, normalizeKnowledge, normalizeWorkDecision, normalizeChangeCandidate"
          new_context = "normalizeProject, normalizeKnowledge, normalizeChangeCandidate"
          if text.count(old_context) != 1:
              raise SystemExit("Work review context token is not unique")
          text = text.replace(old_context, new_context, 1)
          if "normalizeWorkDecision" in text or 'entity_type: "work_decision"' in text:
              raise SystemExit("obsolete Work Decision semantics remain")
          path.write_text(text, encoding="utf-8")
          PY
          node --check mvp_vertical/cockpit/projection/cockpit_projection.js
          rm .github/workflows/cleanup-work-review-projection.yml
      - name: Commit cleanup
        run: |
          git config user.name "Pantheon CI"
          git config user.email "actions@users.noreply.github.com"
          git add mvp_vertical/cockpit/projection/cockpit_projection.js .github/workflows/cleanup-work-review-projection.yml
          git commit -m "refactor(cockpit): remove obsolete Work Decision projection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
